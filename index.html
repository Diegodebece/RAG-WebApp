<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAG Demo</title>
    <script>
      // Applies the saved theme, or the system's, before the first paint so the page never flashes the
      // wrong colors. ThemeProvider takes over from here.
      try {
        const saved = localStorage.getItem('theme')
        const system = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved : system
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
